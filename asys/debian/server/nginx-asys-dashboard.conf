# Reverse proxy for the shared asys dashboard.
# Install: cp to /etc/nginx/sites-available/asys-dashboard, symlink into
# sites-enabled, add TLS/auth as required by your site, reload nginx.
#
# The dashboard only listens on 127.0.0.1:8766 and only accepts requests whose
# Host header is that address, so this proxy rewrites Host and Origin. Any
# other proxy works the same way, or run the dashboard with
# ASYS_DASHBOARD_ARGS="--allow-host your.host:8765" in /etc/asys/server.conf
# and forward the original headers instead.
server {
    listen 8765;
    listen [::]:8765;
    # server_name asys.example.com;
    location / {
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8766;
        proxy_set_header Origin http://127.0.0.1:8766;
        proxy_set_header Sec-Fetch-Site same-origin;
        proxy_read_timeout 300s;
    }
}
