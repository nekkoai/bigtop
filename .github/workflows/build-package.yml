name: build-package

on:
  workflow_call:
    inputs:
      component:
        description: One independent source-build unit
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      COMPONENT: ${{ inputs.component }}
      CARGO_BUILD_JOBS: '2'
      DEB_BUILD_OPTIONS: parallel=2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - uses: actions/setup-go@v5
        if: inputs.component == 'dcomp' || inputs.component == 'asys' || inputs.component == 'asys-images'
        with:
          go-version: '1.25'
          cache-dependency-path: |
            upstream/dcomp/go.sum
            upstream/asys/asys-inference/go.sum

      - uses: docker/setup-buildx-action@v3
        if: inputs.component == 'asys-images'
        with:
          # Upstream builds/saves local daemon tags, not registry-only outputs.
          driver: docker

      - name: Build dependencies
        shell: bash
        run: |
          set -euo pipefail
          deps=(build-essential debhelper devscripts fakeroot python3 zstd xz-utils)
          case "$COMPONENT" in
            dcomp) ;;
            asys|asys-images)
              deps+=(dh-python python3-pip pkg-config libxaw7-dev libxmu-dev
                libxt-dev libxft-dev libxrender-dev libfontconfig-dev libx11-dev) ;;
            capsa-core)
              deps+=(pkg-config cmake clang libclang-dev libssl-dev liblzma-dev zlib1g-dev) ;;
            capsa-llama) deps+=(pkg-config cmake ninja-build) ;;
            capsa-runtime) deps+=(curl ca-certificates patchelf libcrypt1 libgdbm-compat4t64) ;;
            capsa-assets) deps+=(curl ca-certificates) ;;
            *) echo "Unknown component: $COMPONENT" >&2; exit 1 ;;
          esac
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends "${deps[@]}"
          df -h /
          free -h

      - name: Pinned Rust toolchain
        if: inputs.component == 'capsa-core'
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pkg/capsa/rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$version" --profile minimal --target x86_64-unknown-linux-gnu
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: CI-only Debian revision
        run: python3 ci/release-version.py --sha "$GITHUB_SHA" stamp

      - name: Build this source unit
        shell: bash
        run: |
          set -euo pipefail
          case "$COMPONENT" in
            asys-images) ci/build-images.sh ;;
            *) "ci/build-$COMPONENT.sh" ;;
          esac
          # Stamping changes only workspace changelogs. Inputs must still be
          # the exact committed gitlinks, not another checkout or staged pin.
          git diff --exit-code --cached HEAD -- .gitmodules upstream
          python3 - <<'PY'
          import subprocess
          status = subprocess.check_output(["git", "submodule", "status"], text=True)
          assert len(status.splitlines()) == 4
          assert all(line.startswith(" ") for line in status.splitlines()), status
          PY
          mkdir -p build/upload
          cp "build/$COMPONENT/"*.deb build/upload/
          python3 ci/release-version.py --sha "$GITHUB_SHA" record-unit \
            --component "$COMPONENT" --input build/upload \
            --output "build/upload/$COMPONENT.build.json"

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ inputs.component }}
          path: build/upload/*
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 14
