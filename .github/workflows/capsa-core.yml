name: capsa-integration

# Called only after all four independent Capsa build units have succeeded.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: build-capsa-*
          path: build/input

      - name: Check all eight artifacts came from this commit and version
        run: |
          python3 ci/release-version.py --sha "$GITHUB_SHA" stamp
          python3 ci/release-version.py --sha "$GITHUB_SHA" collect \
            --input build/input --dist build/capsa-dist --require-build-records \
            --units capsa-core capsa-runtime capsa-llama capsa-assets

      # This is a fresh hosted VM, not a builder or a serving deployment.
      - name: Real installation, synthetic data, recovery and upgrade checks
        run: |
          sudo apt-get update -q
          sudo env CAPSA_DISPOSABLE_TEST_HOST=1 ci/smoke-test-capsa.sh build/capsa-dist
