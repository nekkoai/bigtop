name: capsa-packages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capsa-core.yml'
      - '.gitmodules'
      - 'upstream/capsa'
      - 'upstream/llama.cpp'
      - 'pkg/capsa/**'
      - 'ci/*capsa*'
      - 'tests/**'
  pull_request:
    paths:
      - '.github/workflows/capsa-core.yml'
      - '.gitmodules'
      - 'upstream/capsa'
      - 'upstream/llama.cpp'
      - 'pkg/capsa/**'
      - 'ci/*capsa*'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: '2'
      DEB_BUILD_OPTIONS: parallel=2
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Native build and fixture-test dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper devscripts fakeroot pkg-config cmake clang \
            libclang-dev libssl-dev liblzma-dev zlib1g-dev ca-certificates \
            python3 zstd ninja-build curl patchelf libcrypt1 libgdbm-compat4t64

      - name: Install the pinned build-only Rust toolchain
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pkg/capsa/rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$version" --profile minimal --target x86_64-unknown-linux-gnu
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Packaging regression tests
        run: python3 -m unittest discover -s tests -v

      - name: Build all eight Capsa packages
        run: ci/build-capsa.sh

      # Explicitly operates only on this disposable runner.
      - name: Install and smoke-test the packages
        run: sudo env CAPSA_DISPOSABLE_TEST_HOST=1 ci/smoke-test-capsa.sh build/capsa-dist

      - uses: actions/upload-artifact@v4
        with:
          name: capsa-noble-amd64
          path: |
            build/capsa-dist/*.deb
            build/capsa-core/*.buildinfo
            build/capsa-core/*.changes
            build/capsa-llama/*.buildinfo
            build/capsa-assets/*.buildinfo
          if-no-files-found: error
